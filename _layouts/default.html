<!DOCTYPE html>
<html lang="{{ page.language | default: 'en' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title | default: "My Blog" }}</title>
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
    <header class="site-header">
        <h1 class="site-title"><a href="/">{{ site.title | default: "My Blog" }}</a></h1>
        <nav class="site-nav">
            <a href="/">Home</a>
        </nav>
    </header>

    <main class="site-content">
        {{ content }}
    </main>

    <footer class="site-footer">
        <p>&copy; {{ 'now' | date: "%Y" }} {{ site.author | default: "Blog Author" }}. All rights reserved.</p>
    </footer>
</body>
</html>
