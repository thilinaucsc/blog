backend:
  name: file-system
  api_root: api  # This creates a local API for managing files

media_folder: "assets/images"
public_folder: "/blog/assets/images"

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string", required: true }
      - { label: "Publish Date", name: "date", widget: "datetime", required: true, format: "YYYY-MM-DD HH:mm" }
      - { label: "Thumbnail Image", name: "thumbnail", widget: "image", required: false }
      - { label: "Summary/Excerpt", name: "excerpt", widget: "textarea", required: true, hint: "This will appear on the home page preview" }
      - { label: "Main Content", name: "body", widget: "markdown", required: true }
      - {
          label: "Language",
          name: "language",
          widget: "select",
          required: true,
          options: [
            { label: "English", value: "en" },
            { label: "Sinhala", value: "si" }
          ],
          default: "en"
        }
      - { label: "Layout", name: "layout", widget: "hidden", default: "post" }